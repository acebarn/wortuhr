; Wortuhr — siehe DESIGN.md
;
;   pio test -e native        Kern-Tests auf dem Rechner
;   pio run -e wortuhr        Firmware bauen
;   pio run -e wortuhr -t upload
;   pio run -e wortuhr -t uploadfs

[platformio]
default_envs = wortuhr

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11 -std=gnu++14

[env:wortuhr]
platform = espressif8266
board = nodemcuv2
framework = arduino

board_build.filesystem = littlefs
monitor_speed = 115200

; Der verbaute CH340 (VID:PID 1A86:7523) bricht bei 921600 nach dem
; Baudratenwechsel ab: "Invalid head of packet". 115200 laeuft zuverlaessig,
; kostet fuer ~290 KB rund 40 s.
upload_speed = 115200

; NeoPixelBus statt Adafruit_NeoPixel: nutzt auf dem ESP8266 DMA bzw. UART und
; sperrt beim Ausgeben keine Interrupts. Adafruit sperrt sie ~3,4 ms pro Frame,
; was mit aktivem WLAN unnoetig Risiko ist.
;
; Kein WiFiManager: dessen autoConnect() blockiert in setup(). Die Uhr baut die
; Verbindung stattdessen als nicht blockierenden Zustandsautomat auf (DESIGN 9.1).
lib_deps =
    makuna/NeoPixelBus@^2.7.9
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

; Einmaliger Lauf zum Ausmessen: Rasterausrichtung und Zuordnung der vier
; Eckpunkte zu den Strip-Indizes 110-113. Serielle Ausgabe mitlesen.
;
;   pio run -e wortuhr-mapping -t upload && pio device monitor
[env:wortuhr-mapping]
extends = env:wortuhr
build_flags = ${env:wortuhr.build_flags} -DDOT_MAPPING_TEST

; Host-Tests fuer lib/wordclock. Kein Arduino, keine Hardware.
; test_framework bleibt auf der Vorgabe "unity" -- die bringt PlatformIO mit,
; sie braucht keine externe Abhaengigkeit und laeuft auch auf dem Geraet.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_unflags =

; Terminal-Vorschau des Panels. Benutzt die echte Kette ClockRenderer ->
; Compositor, damit das Bild dem entspricht, was auf der Wand stehen wird.
;
;   pio run -e preview && .pio/build/preview/program --help
[env:preview]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_unflags =
build_src_filter = -<*> +<../tools/preview/>
