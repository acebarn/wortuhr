# Lovelace-Dashboard fuer die Wortuhr.
#
# Einspielen: HomeAssistant -> Einstellungen -> Dashboards -> Dashboard
# hinzufuegen -> oben rechts Stift -> Drei-Punkte-Menue -> "Raw-Konfigurationseditor"
# -> Inhalt dieser Datei einfuegen.
#
# Die Entitaeten legt die Uhr selbst per MQTT-Discovery an; hier steht nur, wie
# sie angeordnet werden. Eine neue Einstellung in der Firmware erscheint in HA
# also von allein -- auf dieser Karte aber erst, wenn sie hier eingetragen wird.
# Das ist Absicht: eine Karte, die sich selbst umbaut, waere nicht vorhersagbar.
#
# ENTITAETS-IDs KOMMEN AUS DEM LABEL, nicht aus obj_id: HomeAssistant bildet
# <domain>.<geraet>_<label> und macht daraus Kleinbuchstaben mit Unterstrichen.
# Aus "Verlauf-Zielfarbe" wird text.wortuhr_verlauf_zielfarbe. Wer ein Label in
# Config.h aendert, benennt damit die Entitaet um und bricht dieses Dashboard --
# Labels sind Schnittstelle, nicht Beschriftung.

views:
  - title: Wortuhr
    path: wortuhr
    icon: mdi:clock-text-outline
    cards:
      # --- Kopf: laeuft sie ueberhaupt? ------------------------------------
      - type: entities
        title: Zustand
        show_header_toggle: false
        entities:
          - entity: sensor.wortuhr_status
            name: Status
          - entity: sensor.wortuhr_letzter_zeitsync
            name: Letzter Zeitsync
          - type: divider
          - entity: number.wortuhr_helligkeit
            name: Helligkeit
          - entity: text.wortuhr_farbe
            name: Farbe (RRGGBB)
          - type: divider
          # Spielt alle Animationen in zufaelliger Reihenfolge, jede eine
          # Minute lang. Weicht allem, was Absicht ist: HA-Telegramme und
          # Stundenschlag haben Vorrang, nachts schweigt er ganz.
          - entity: switch.wortuhr_ambient_modus
            name: Ambient-Modus

      # --- Anzeige ----------------------------------------------------------
      - type: entities
        title: Anzeige
        show_header_toggle: false
        entities:
          - entity: switch.wortuhr_farbverlauf
            name: Farbverlauf
          - entity: text.wortuhr_verlauf_zielfarbe
            name: Verlauf-Zielfarbe
          - type: divider
          - entity: select.wortuhr_uebergang
            name: Uebergang
          - entity: number.wortuhr_uebergangsdauer
            name: Uebergangsdauer (ms)
          - type: divider
          - entity: number.wortuhr_geisterwoerter
            name: Geisterwoerter
          - entity: switch.wortuhr_fuellbuchstaben_mitglimmen
            name: Fuellbuchstaben mitglimmen
          - entity: number.wortuhr_sekundenatmen
            name: Sekundenatmen

      # --- Animationen ------------------------------------------------------
      #
      # Kein Discovery-Knopf, sondern direkte Telegramme auf den Notify-Kanal:
      # Animationen sind Ereignisse, keine Einstellung. Alle benutzen denselben
      # Kanalnamen "dashboard" -- ein zweiter Druck loest den ersten ab, statt
      # sich zu stapeln.
      - type: grid
        columns: 3
        square: false
        cards:
          - type: button
            name: Regenbogen
            icon: mdi:looks
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"regenbogen","ttl":30}'
          - type: button
            name: Feuer
            icon: mdi:fire
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"feuer","ttl":30}'
          - type: button
            name: Nordlicht
            icon: mdi:weather-night
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"nordlicht","ttl":30}'
          - type: button
            name: Wirbel
            icon: mdi:sync
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"wirbel","ttl":30}'
          - type: button
            name: Komet
            icon: mdi:comet
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"komet","ttl":30}'
          - type: button
            name: Konfetti
            icon: mdi:party-popper
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"konfetti","ttl":30}'
          - type: button
            name: Ozean
            icon: mdi:waves-arrow-right
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"ozean","ttl":30}'
          - type: button
            name: Glut
            icon: mdi:fireplace
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"glut","ttl":30}'
          - type: button
            name: Matrix
            icon: mdi:code-braces
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"matrix","ttl":30}'
          - type: button
            name: Plasma
            icon: mdi:blur
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"plasma","ttl":30}'
          - type: button
            name: Welle
            icon: mdi:waves
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"welle","ttl":30}'
          - type: button
            name: Tropfen
            icon: mdi:water
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"tropfen","ttl":30}'
          - type: button
            name: Silvester
            icon: mdi:firework
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"silvester","ttl":30}'
          - type: button
            name: Sonnenaufgang
            icon: mdi:weather-sunset-up
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","prio":80,"style":"anim","anim":"sonnenaufgang","ttl":30}'
          # Abbrechen loescht denselben Kanal wieder. Ohne diesen Knopf
          # muesste man 30 Sekunden warten, bis die Uhrzeit zurueckkommt.
          - type: button
            name: Stopp
            icon: mdi:stop
            show_state: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: wortuhr/notify
                payload: '{"id":"dashboard","clear":true}'

      # --- Stundenschlag ----------------------------------------------------
      - type: entities
        title: Stundenschlag
        show_header_toggle: false
        entities:
          - entity: switch.wortuhr_stundenschlag
            name: Zur vollen Stunde
          - entity: select.wortuhr_animation
            name: Animation
          - entity: number.wortuhr_dauer
            name: Dauer (s)

      # --- Nacht und Aus ----------------------------------------------------
      #
      # Zwei getrennte Fenster: nachts gedimmt und warm, "aus" wirklich dunkel.
      # HomeAssistant hat Vorrang vor beiden (DESIGN 6).
      - type: entities
        title: Nacht
        show_header_toggle: false
        entities:
          - entity: switch.wortuhr_nachtmodus
            name: Nachtmodus
          - entity: text.wortuhr_nacht_ab
            name: Nacht ab
          - entity: text.wortuhr_nacht_bis
            name: Nacht bis
          - entity: number.wortuhr_helligkeit_nachts
            name: Helligkeit nachts
          - entity: text.wortuhr_farbe_nachts
            name: Farbe nachts

      - type: entities
        title: Abschaltzeit
        show_header_toggle: false
        entities:
          - entity: switch.wortuhr_abschaltzeit
            name: Abschaltzeit
          - entity: text.wortuhr_aus_ab
            name: Aus ab
          - entity: text.wortuhr_aus_bis
            name: Aus bis

      # --- Selten gebraucht -------------------------------------------------
      - type: entities
        title: Technik
        show_header_toggle: false
        state_color: false
        entities:
          - entity: number.wortuhr_ueberblendung
            name: Ueberblendung
          - entity: number.wortuhr_strombegrenzung_ma
            name: Strombegrenzung (mA)
          - type: divider
          - entity: sensor.wortuhr_wlan_signal
            name: WLAN-Signal
          - entity: sensor.wortuhr_geschaetzter_strom
            name: Geschaetzter Strom
          - entity: sensor.wortuhr_freier_speicher
            name: Freier Speicher
          - entity: sensor.wortuhr_laufzeit
            name: Laufzeit
